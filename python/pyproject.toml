[project]
name = "basalt-vault"
version = "1.0.0"
description = "Python implementation of the Basalt Protocol v1 — a portable knowledge vault in any object store"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carter Cole" }]
keywords = ["basalt", "knowledge-base", "markdown", "wikilink", "s3", "acl", "vault"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]

# Both are load-bearing, not conveniences. `regex` carries the Unicode
# property escapes §9.1 extraction and §13.3 ordering rely on, which `re`
# does not support; `ruamel.yaml` round-trips comments, which §13.4 requires
# an implementation to preserve when it edits YAML it did not author.
dependencies = [
    "ruamel.yaml>=0.18",
    "regex>=2024.5.15",
]

[project.urls]
Homepage = "https://github.com/CarterCole/python-basalt"
Repository = "https://github.com/CarterCole/python-basalt"
Issues = "https://github.com/CarterCole/python-basalt/issues"
Specification = "https://github.com/CarterCole/basalt/blob/main/protocol/PROTOCOL.md"

[project.scripts]
basalt = "basalt.cli:main"

[project.optional-dependencies]
# §1: the S3-compatible transport. Kept optional so the core protocol —
# indexing, link resolution, ACL evaluation — runs with no cloud dependency
# installed at all.
s3 = ["boto3>=1.34"]
# `basalt find` and basalt.topics: topic search over a vault. Not protocol and
# Python-only, so it cannot be a core dependency: it brings numpy and scipy to
# a package whose other dependencies are a YAML parser and a regex engine.
topics = ["gensim>=4.4.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "boto3>=1.34",
    "gensim>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basalt"]

# The tests read the conformance corpus from the spec checkout (../conformance
# in the monorepo, the `spec/` submodule in the per-language repository), which
# an sdist does not carry, so an sdist that included them would ship a suite
# that cannot find its fixtures. Conformance is checked from the checkout,
# before release. The submodule and the release workflow stay out for the same
# reason.
[tool.hatch.build.targets.sdist]
exclude = ["tests/", "uv.lock", ".github/", ".gitmodules", "spec/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["basalt"]
