[project]
name = "basalt-protocol"
version = "0.1.0"
description = "Python implementation of the Basalt Protocol v1 — a portable knowledge vault in any object store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.18",
    "regex>=2024.5.15",
]

[project.scripts]
basalt = "basalt.cli:main"

[project.optional-dependencies]
# §1: the S3-compatible transport. Kept optional so the core protocol —
# indexing, link resolution, ACL evaluation — runs with no cloud dependency
# installed at all.
s3 = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basalt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["basalt"]
