# Basalt Protocol v1 — Rust implementation.
#
# One crate, `basalt-vault`: the `basalt` library, which implements the
# protocol with no cloud dependency unless the `s3` feature is on, and the
# `basalt` binary — the CLI, the self-check PROTOCOL §14.3 requires, and the
# MCP server.
[workspace]
resolver = "2"
members = ["basalt"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.83"  # io::ErrorKind::{IsADirectory, NotADirectory}
license = "MIT"
repository = "https://github.com/CarterCole/rust-basalt"
homepage = "https://github.com/CarterCole/rust-basalt"
keywords = ["basalt", "knowledge-base", "markdown", "s3", "vault"]
categories = ["text-processing", "filesystem", "web-programming"]

[workspace.dependencies]
md-5 = "0.11.0"
rand = "0.10.3"
regex = "1.12.3"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"

[profile.release]
opt-level = 2
