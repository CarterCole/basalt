# Pushing a tag `vX.Y.Z` stages basalt-vault X.Y.Z on npm, with provenance. It
# is not live until a maintainer approves it with 2FA: in the package's
# "Staged Packages" tab on npmjs.com, or with `npm stage approve <stage-id>`.
#
# The tag has to match the version in package.json, and the whole suite has to
# pass against the conformance corpus pinned in the `spec` submodule, so a tag
# records exactly which corpus the release was checked against. A tag with a
# prerelease part (v1.1.0-rc.1) goes out under the `next` dist-tag, so it never
# becomes what `npm install basalt-vault` fetches.
#
# Authentication is keyless once the package has an npm Trusted Publisher for
# this repository and workflow `release.yml`, allowed to `npm stage publish`
# (npm's default; staging needs npm 11.15 or later). Until the package exists
# there is nothing to attach one to, so the first release uses a repository
# secret named NPM_TOKEN. It only has to stage, so it does not need to bypass
# 2FA. Once the first version is live, add the Trusted Publisher and delete the
# secret.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
      - run: npm ci
      - name: Tests, including the conformance corpus
        run: npm test
      - name: The tarball holds what it should
        run: npm publish --dry-run

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # 11.15 or later for `npm stage`. Not 12: 12.1.0 mangles a bin entry at
      # pack time.
      - name: A recent npm, for staged publishing
        run: npm install -g npm@^11.20.0
      - run: npm ci
      - name: Stage for approval
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          npm stage publish --provenance --access public --tag "$tag"
        env:
          # The placeholder is what actions/setup-node itself exports when no
          # token is configured, so without an NPM_TOKEN secret npm falls back
          # to the Trusted Publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || 'XXXXX-XXXXX-XXXXX-XXXXX' }}
