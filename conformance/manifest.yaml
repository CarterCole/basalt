# Basalt conformance corpus inventory.
#
# Every implementation ships a runner that loads these cases and asserts
# against them (PROTOCOL §14.2). No implementation defines its own
# expectations for behavior the spec covers.
basalt: 1
corpus: 1

suites:
  - {file: cases/keys/validation.yaml,        level: L0, spec: "1.1", cases: 15}
  - {file: cases/paths/collisions.yaml,       level: L1, spec: "2.2", cases: 4}
  - {file: cases/paths/folders.yaml,          level: L1, spec: "2.1", cases: 3}
  - {file: cases/frontmatter/parsing.yaml,    level: L1, spec: "5.2", cases: 11}
  - {file: cases/links/extraction.yaml,       level: L2, spec: "9.1", cases: 4}
  - {file: cases/links/resolution.yaml,       level: L2, spec: "9.2", cases: 13}
  - {file: cases/acl/evaluation.yaml,         level: L3, spec: "8.4", cases: 24}

# Interop suites are keyed by profile rather than level (§17): they describe
# the same read surface in other protocols, and none is a prerequisite for
# another.
  - {file: cases/interop/surfaces.yaml,      profile: "*",         spec: "INTEROP 1-8", cases: 9}
  - {file: cases/interop/equivalence.yaml,   profile: P-INTEROP,   spec: "INTEROP 9",   cases: 7}

vaults:
  - {dir: vaults/minimal, level: L2, note: "byte-exact index reproduction (§13)"}

# A runner reports per level. An implementation claiming level N must pass
# every suite at level N and below.
levels:
  L0: Transport
  L1: Content
  L2: Index
  L3: Security
  L4: Gatekeeper
  L5: History

# Profiles are orthogonal to levels and each requires L4 (INTEROP §10). A
# runner skips a profile's suite unless the implementation declares it.
profiles:
  P-REST: REST with an OpenAPI 3.1 document
  P-GRAPHQL: GraphQL with served SDL
  P-JSONRPC: JSON-RPC 2.0
  P-MCP: Model Context Protocol, HTTP and stdio
  P-GRPC: gRPC/Connect over basalt.proto
  P-WEBDAV: read-only WebDAV class 1
  P-FEEDS: Atom, RSS, sitemap, OpenSearch
  P-RDF: JSON-LD and Turtle
  P-INTEROP: two or more of the above, held equivalent
