# What each interop profile must answer, INTEROP §10.
#
# Language-neutral on purpose: a runner reads the request shape, issues it
# through whatever client its language has, and asserts the named property.
# No implementation defines its own expectations for behavior the annex covers.
basalt: 1
spec: "INTEROP §§1-8"

# Every method-call surface exposes exactly these operations, under the
# spelling its own column gives (INTEROP §1.2). `required` is narrower than
# `args` wherever the argument has a default: `list` with no folder means the
# root, `node` with no include_text still returns the text. A runner checks the list, not
# just that a few of them work: an operation missing from one surface and
# present in another is the drift this corpus exists to catch.
operations:
  - {name: manifest,  rpc: basalt.manifest,  tool: basalt_manifest,  proto: GetManifest,
     args: [],                                  required: []}
  - {name: me,        rpc: basalt.me,        tool: basalt_me,        proto: GetIdentity,
     args: [],                                  required: []}
  - {name: node,      rpc: basalt.node,      tool: basalt_node,      proto: GetNode,
     args: [path, include_text, include_bytes], required: [path]}
  - {name: list,      rpc: basalt.list,      tool: basalt_list,      proto: ListFolder,
     args: [folder],                            required: []}
  - {name: nodes,     rpc: basalt.nodes,     tool: basalt_nodes,     proto: ListNodes,
     args: [limit, offset, published],          required: []}
  - {name: links,     rpc: basalt.links,     tool: basalt_links,     proto: GetLinks,
     args: [path],                              required: [path]}
  - {name: search,    rpc: basalt.search,    tool: basalt_search,    proto: Search,
     args: [q, limit, offset],                  required: [q]}
  - {name: tree,      rpc: basalt.tree,      tool: basalt_tree,      proto: GetTree,
     args: [],                                  required: []}
  - {name: tags,      rpc: basalt.tags,      tool: basalt_tags,      proto: GetTags,
     args: [],                                  required: []}
  - {name: recent,    rpc: basalt.recent,    tool: basalt_recent,    proto: GetRecent,
     args: [limit, published],                  required: []}
  - {name: effective, rpc: basalt.effective, tool: basalt_effective, proto: GetEffectiveRights,
     args: [path, principal],                   required: [path]}

# The fault table (INTEROP §1.3). A runner asserts the whole row, because a
# surface that maps `forbidden` onto 404 is leak-free but useless, and one
# that maps `not_found` onto 403 is the leak §12.3 forbids.
faults:
  - {fault: not_found,          http: 404, connect: not_found,         jsonrpc: -32004, graphql: not_found}
  - {fault: forbidden,          http: 403, connect: permission_denied, jsonrpc: -32003, graphql: forbidden}
  - {fault: unauthenticated,    http: 401, connect: unauthenticated,   jsonrpc: -32001, graphql: unauthenticated}
  - {fault: bad_request,        http: 400, connect: invalid_argument,  jsonrpc: -32602, graphql: bad_request}
  - {fault: method_not_allowed, http: 405, connect: unimplemented,     jsonrpc: -32601, graphql: method_not_allowed}
  - {fault: internal,           http: 500, connect: internal,          jsonrpc: -32603, graphql: internal}

profiles:
  P-REST:
    spec: "INTEROP §2"
    routes:
      - {method: GET, path: /api/v1/manifest}
      - {method: GET, path: /api/v1/me}
      - {method: GET, path: /api/v1/openapi.json}
      - {method: GET, path: "/api/v1/node/{path}"}
      - {method: GET, path: "/api/v1/raw/{path}"}
      - {method: GET, path: "/api/v1/list/{folder}"}
      - {method: GET, path: /api/v1/nodes}
      - {method: GET, path: "/api/v1/links/{path}"}
      - {method: GET, path: /api/v1/search}
      - {method: GET, path: /api/v1/tree}
      - {method: GET, path: /api/v1/tags}
      - {method: GET, path: /api/v1/effective}
    requires:
      - openapi_3_1_document_describes_every_route
      - errors_are_rfc9457_problem_documents
      - etag_and_if_none_match_supported
      - head_returns_headers_without_body
      - mutating_methods_return_405

  P-GRAPHQL:
    spec: "INTEROP §3"
    endpoint: /graphql
    schema: /graphql/schema.graphql
    requires:
      - no_mutation_or_subscription_type
      - denial_is_a_field_error_with_extensions_code
      - partial_results_are_returned_with_errors
      - introspection_supports_codegen
      - unknown_field_fails_before_execution

  P-JSONRPC:
    spec: "INTEROP §4.1"
    endpoint: /rpc
    requires:
      - methods_are_basalt_dot_operation
      - notification_without_id_gets_no_response
      - basalt_operations_describes_the_table

  P-MCP:
    spec: "INTEROP §4.2"
    endpoints: [/mcp, "stdio"]
    requires:
      - initialize_echoes_a_supported_version_else_latest
      - tools_are_the_operation_table_with_json_schemas
      - resource_uri_is_basalt_scheme_with_vault_authority
      - foreign_vault_authority_is_refused
      - tools_call_denial_is_isError_result
      - resources_read_denial_is_jsonrpc_error
      - stdio_writes_only_jsonrpc_to_stdout

  P-GRPC:
    spec: "INTEROP §5"
    service: basalt.v1.BasaltRead
    requires:
      - every_operation_has_a_unary_method
      - json_name_equals_snake_case_field_name
      - rights_kinds_decisions_are_strings_not_enums
      - unsupported_codec_answers_unimplemented

  P-WEBDAV:
    spec: "INTEROP §6"
    mount: /dav/
    requires:
      - options_advertises_dav_1
      - propfind_depth_0_and_1
      - unreadable_children_are_omitted_not_403
      - unknown_requested_property_returns_404_propstat
      - every_write_method_returns_405
      - withheld_trees_are_not_mountable

  P-FEEDS:
    spec: "INTEROP §7"
    routes: [/feed.atom, /feed.xml, /sitemap.xml, /opensearch.xml, /robots.txt]
    requires:
      - entries_are_readable_and_published_only
      - entry_id_is_urn_basalt_node
      - responses_are_private_no_store
      - robots_follows_the_audience_ceiling
      - no_presigned_url_in_any_entry

  P-RDF:
    spec: "INTEROP §8"
    routes: [/graph.jsonld, /graph.ttl]
    requires:
      - node_iri_is_the_gatekeeper_node_url
      - standard_terms_used_where_they_exist
      - redacted_edges_are_counted_not_emitted

  P-INTEROP:
    spec: "INTEROP §9"
    requires_profiles: 2
    requires:
      - discovery_document_lists_exactly_the_mounted_surfaces
      - all_equivalence_questions_pass
